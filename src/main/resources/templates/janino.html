<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Janino Dynamic Rule Engine Demo</title>

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        label {
            font-size: 16px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            margin-bottom: 20px;
            margin-top: 20px;
            font-size: 16px;
        }

        button {
            width: 48%;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        .btn-hardcoded {
            background: #007bff;
        }

        .btn-dynamic {
            background: #28a745;
        }

        .result-box {
            margin-top: 25px;
            padding: 18px;
            background: #eef6ff;
            border-left: 4px solid #007bff;
            border-radius: 6px;
            font-size: 18px;
            display: none;
        }

        .rule-box {
            background: #fff7e6;
            padding: 15px;
            border-left: 5px solid #ff9800;
            margin-top: 25px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h1>Janino Dynamic Discount Demo</h1>

<div class="container">

    <label>Enter Amount:</label>
    <input class="mb-3" id="amount" type="number" placeholder="Enter purchase amount">

    <div style="display: flex; justify-content: space-between;">
        <button class="btn-hardcoded" onclick="calcHardcoded()">Hardcoded Discount</button>
        <button class="btn-dynamic" onclick="calcDynamic()">Dynamic Discount</button>
    </div>

    <div id="result" class="result-box"></div>

    <!--    <h3>Current Dynamic Rule:</h3>-->
    <!--    <div id="ruleDisplay" class="rule-box">Loading rule...</div>-->

</div>

<script>
    function calcHardcoded() {
        let amount = document.getElementById("amount").value;
        if (!amount) return alert("Enter amount first!");

        fetch(`/hardcoded?amount=${amount}`)
            .then(res => res.text())
            .then(data => showResult("Hardcoded Discount Result: " + data));
    }

    function calcDynamic() {
        let amount = document.getElementById("amount").value;
        if (!amount) return alert("Enter amount first!");

        fetch(`/dynamic?amount=${amount}`)
            .then(res => res.text())
            .then(data => showResult("Dynamic Discount Result: " + data));
    }

    function showResult(text) {
        let box = document.getElementById("result");
        box.style.display = "block";
        box.innerHTML = text;
    }

    // Fetch rule content from Spring Boot file system

<!--            })-->
<!--            .catch(() => {-->
<!--                document.getElementById("ruleDisplay").textContent = "Unable to load rule.";-->
<!--            });-->
<!--    }-->

    window.onload = loadRule;
</script>

</body>
</html>
